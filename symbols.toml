name = "dc_crt_entry"
emit = false
status = "guessed"
note = "entry point do EXE boot (Exec via SYSTEM.CNF); ~0xA0 bytes, chama init e salta para o jogo"

# --- hand-curated (existing names always win over appended guesses) ---
