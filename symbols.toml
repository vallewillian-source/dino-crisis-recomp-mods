# ===== nucleo do jogo =====
[[func]]
pc = 0x8001A1C8
name = "dc_crt_entry"
status = "guessed"
note = "entry point do EXE boot (Exec via SYSTEM.CNF); chama incializacao e GameMain"

[[func]]
pc = 0x8001CE10
name = "GameMain"
status = "analyzed"
note = "init geral + loop de cena externo + loop de frame interno; contador de frame em G+0x04 (G=0x800B7A20); troca tasks via Task_SetStart(0, Title_Task|GameTask_Run)"

[[func]]
pc = 0x80020750
name = "Task_SetStart"
status = "analyzed"
note = "registra handler no slot (stride 0x18, flag ativo) se slot inativo; tabela de tasks em 0x800B5838"

[[func]]
pc = 0x8002086C
name = "Task_Switch"
status = "analyzed"
note = "troca o handler corrente (ex.: TitleMenu -> GameTask_Run ao iniciar jogo)"

[[func]]
pc = 0x8002080C
name = "Task_Clear"
status = "analyzed"
note = "limpa slot de task; GameMain chama com (0..3) ao sair de cena"

[[func]]
pc = 0x80020640
name = "TaskScheduler_Run"
status = "analyzed"
note = "scheduler cooperativo: abre/alterna threads via BIOS OpenThread/ChangeThread"

[[func]]
pc = 0x80020A40
name = "Title_Task"
status = "analyzed"
note = "task do titulo: SceneLoad_Start(recursos) e aguarda SceneLoad_IsBusy"

[[func]]
pc = 0x80049B80
name = "TitleMenu_Update"
status = "analyzed"
note = "menu do titulo, 3 entradas (0x80018674/78/7C); ao escolher gameplay chama Task_Switch(GameTask_Run)"

[[func]]
pc = 0x8002A094
name = "SceneLoad_Start"
status = "analyzed"
note = "inicia load de cena/arquivo (id, destino); estados do loader em 0x800c33xx"

[[func]]
pc = 0x80029654
name = "SceneLoad_IsBusy"
status = "analyzed"

[[func]]
pc = 0x800296C0
name = "SceneUpdate_Dispatch"
status = "analyzed"
note = "despacha update da cena via PTR_func_80029E0C_8009acac[indice]"

[[func]]
pc = 0x80077810
name = "GameTask_Run"
status = "analyzed"
note = "task do gameplay: zera estruturas (0xb0 + 0x850 bytes) e despacha FSM via PTR_func_8007787C_800a8914[estado]"

[[func]]
pc = 0x8007787C
name = "GameFsm_Advance"
status = "analyzed"
note = "estado[0]: avanca estado da FSM do gameplay"

[[func]]
pc = 0x800778CC
name = "GameFsm_DispatchSub"
status = "analyzed"
note = "estado[1]: despacha sub-tabela em 0x800a8920 (FSM aninhada - IA/gameplay detalhado vive aqui)"

[[func]]
pc = 0x80079BE8
name = "GameFsm_EndTask"
status = "guessed"
note = "encerra gameplay; volta a task do titulo/menu"

